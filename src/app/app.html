<!-- Lien d'évitement : permet aux utilisateurs du clavier de passer directement au contenu. -->
<a class="lien-evitement" href="#contenu">Aller au contenu</a>

<header class="entete">
  <div class="entete-contenu">
    <h1>{{ title() }}</h1>
    <nav aria-label="Navigation principale">
      <a routerLink="/guides" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }">
        Répertoire
      </a>
      <a routerLink="/guides/nouveau" routerLinkActive="actif">Ajouter un guide</a>
    </nav>
  </div>
</header>

<app-notification />

<main id="contenu" tabindex="-1">
  <router-outlet />
</main>

<footer class="pied">
  <p>Évaluation finale Angular · Licence 2 Ingénierie Informatique · données fictives</p>
</footer>
